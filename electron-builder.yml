# How The Hive becomes something you can install.
#
# `electron-vite` already produces `out/{main,preload,renderer}`; this turns that
# into a `.app` inside a `.dmg`, plus the `.zip` and `latest-mac.yml` that
# `electron-updater` needs to find a newer one. See `docs/packaging-and-updates.md`.

# The bundle identifier, and **not** a cosmetic string.
#
# For a Developer ID build it is part of the *designated requirement* Squirrel
# checks before swapping one version for the next, so changing it after signed
# releases begin breaks in-place updating across exactly one release. It was
# changed from `dev.yunidbauza.the-hive` in the same release that introduced
# signing, because that release already required a manual install — the one
# moment the change costs nothing.
appId: com.behiques.the-hive

# The app's identity, not its display name: it names the bundle (`The Hive.app`),
# its executable, the dmg and zip the updater fetches, and so the Finder
# label and the path a server's LaunchAgent runs. The name people read,
# "Hive TTY", is set over it below as `CFBundleDisplayName` (`mac.extendInfo`)
# and in `electron/shared/app-name.ts`. Changing this one is a migration, not a rename:
# see "The app's name" in `docs/packaging-and-updates.md`.
productName: The Hive

copyright: Copyright © 2026 Behiques Consulting LLC

directories:
  # The icons are already here and already named what electron-builder looks
  # for — `resources/README.md` wrote this block before the packaging existed.
  buildResources: resources
  output: dist

# `node_modules` is not listed and does not need to be: electron-builder always
# bundles production dependencies, and listing files here only narrows what is
# taken from the project root. Without this it would pack `src/`, `tests/`,
# `coverage/` and the Playwright reports into the app.
files:
  - out/**
  - package.json

# The one native module in the tree, and it cannot live inside the archive.
#
# `node-pty` does not merely load a `.node` binary — it *spawns* a helper
# executable, `prebuilds/darwin-arm64/spawn-helper`, by path. A path inside
# `app.asar` is not a path the kernel can exec: asar is a virtual filesystem
# that Electron's `fs` shims understand and `posix_spawn` does not. Packed, the
# app launches perfectly and then throws `posix_spawnp failed` the first time
# anyone opens a terminal — which is to say, the first time anyone uses the app.
#
# Unpacking also preserves the file mode, which matters because the published
# tarball ships `spawn-helper` at 0644. `scripts/check-native-abi.mjs --fix`
# repairs that at install time, so the bit is already set by the time this runs;
# `pnpm test:pty` and the packaged smoke check both verify it survived.
asarUnpack:
  - '**/node_modules/node-pty/**'

# The server-mode menu-bar icon (HIVE-147), read at runtime by `trayIconPath`.
# `nativeImage` decodes PNG and JPEG only, so the `.icns` below is no use to a
# `Tray`; this puts the template pair at `Contents/Resources/tray/`.
extraResources:
  - from: resources/tray
    to: tray
  # The skills and agents the app ships (HIVE-162), seeded into `~/.hive` on
  # boot by `electron/main/seed/`. Read at runtime like the tray icon, so they
  # ride the same block; `shippedRoot` in `seed/paths.ts` names both locations.
  - from: resources/skills
    to: skills
  - from: resources/agents
    to: agents
  # Every past version of those files as part hashes, for a `~/.hive` seeded
  # before the seed merged part by part (`pnpm seed:history`).
  - from: resources/shipped-history.json
    to: shipped-history.json

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  # The name people read, over the identity `productName` keeps
  # (`electron/shared/app-name.ts`): the Dock, Cmd-Tab and Launchpad prefer
  # the display name, so they say "Hive TTY"; Finder still says "The Hive"
  # (the file name). The key is not part of the code signature's designated
  # requirement, so in-place updates are unaffected.
  #
  # `CFBundleName` must stay `productName`. Electron locates its helper apps
  # as `<CFBundleName> Helper.app` under Contents/Frameworks and aborts at
  # launch (`FATAL: Unable to find helper app`, electron_main_delegate_mac.mm)
  # when that bundle is missing, while electron-builder names the helpers
  # from `productName`. Overriding it shipped 1.0.0 crashing 85ms after
  # launch on every install; so the leftmost menu title reads "The Hive".
  extendInfo:
    CFBundleDisplayName: Hive TTY
  target:
    - target: dmg
      arch: [arm64]
    # Not optional, and not a convenience download.
    #
    # `electron-updater` on macOS updates from a **zip**, never from the dmg —
    # Squirrel.Mac takes an archive it can unpack and swap. A release published
    # with only a dmg produces an app that can see a new version and cannot
    # install it, which is the exact failure this project set out to avoid.
    - target: zip
      arch: [arm64]

  # **Signing configures itself from what is present.** There is no flag to flip
  # and no second command to remember: a machine that has a Developer ID
  # produces a signed, notarized build, and one that does not produces the
  # ad-hoc build this project shipped before, from the same `pnpm desktop:dist`.
  #
  # That works because both switches below degrade rather than fail, which was
  # read out of electron-builder 26's own source rather than assumed:
  #
  # - **`identity` is deliberately absent, not `null`.** `null` means "do not
  #   look", which is what produced the unsigned bundle this file used to
  #   describe. Absent means auto-discovery: electron-builder searches the
  #   keychain, signs with a `Developer ID Application` certificate if it finds
  #   one, and logs `skipped macOS application code signing` if it does not.
  # - **`notarize: true` is safe with no credentials.** `notarizeIfProvided`
  #   asks for notarization options and, when the environment supplies none,
  #   logs `skipped macOS notarization` and returns. It is also only reached
  #   from inside the signing step, so an unsigned build never attempts it.
  #
  # Credentials come from the environment, never from this file:
  # `APPLE_API_KEY` / `APPLE_API_KEY_ID` / `APPLE_API_ISSUER` (App Store Connect
  # key), or `APPLE_ID` / `APPLE_APP_SPECIFIC_PASSWORD` / `APPLE_TEAM_ID`. CI
  # adds `CSC_LINK` and `CSC_KEY_PASSWORD` to import the certificate.
  notarize: true

  # Required by notarization — Apple rejects a submission without it.
  #
  # It is what makes entitlements load-bearing: under the hardened runtime a
  # process may not allocate write-then-execute memory, load unsigned libraries,
  # or be injected into unless it says so. electron-builder's default template
  # grants three — `allow-jit` and `allow-unsigned-executable-memory` for V8,
  # and `disable-library-validation` for `node-pty`, whose `.node` binary and
  # `spawn-helper` are loaded and executed out of `app.asar.unpacked`.
  hardenedRuntime: true

  # The template stopped being enough at the microphone (#307). A `claude` in a
  # Hive pty asks for it as The Hive, the process macOS holds responsible, and
  # the hardened runtime refuses a bundle without `device.audio-input` *silently*:
  # no prompt, no row in Privacy › Microphone, Claude Code's voice mode just
  # never hears anything. So the plist is carried now, the template's three
  # verbatim plus that one. When an Electron upgrade changes the template, this
  # copy does not follow; `tests/package-manifest.test.ts` pins all four.
  #
  # Both keys, because they sign different binaries: `entitlements` the app
  # itself, `entitlementsInherit` every helper inside it, the pty host's utility
  # process among them. Unset, the second falls back to the template.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

  # Gatekeeper's quarantine flag is set by whatever *downloads* a file, so a dmg
  # pulled from a browser is quarantined and an unsigned app inside it is
  # refused with "damaged and can't be opened". An update the app fetches itself
  # is not quarantined, which is why the in-app path is worth having even
  # unsigned. `docs/packaging-and-updates.md` records the one-line escape for a
  # manually downloaded copy.
  darkModeSupport: true

# Two jobs, because electron-builder takes one hook path — see
# `scripts/after-pack.mjs` for the order and why it matters.
#
# **The gate**, `scripts/verify-packaged-modules.mjs`: walk the module graph
# inside the packed `app.asar` and fail the build if anything the app will
# require at runtime is not in there. v0.10.0 shipped without `undici`, which
# `@slack/socket-mode` declares as a *peer* dependency — an edge pnpm satisfies
# in the repo and electron-builder's collector never follows — and every copy
# died on `Cannot find module 'undici'` before drawing a window. This runs
# before the dmg, the zip and the upload exist.
#
# **The fallback signature**, `scripts/adhoc-sign.mjs`, for builds made without
# a Developer ID. It **skips itself** when a real identity is available, so it
# is the unsigned-machine path only — that file records how it decides and why
# it must not run in front of a certificate build.
afterPack: scripts/after-pack.mjs

dmg:
  # Drag-to-Applications, which is what everyone expects and what avoids people
  # running the app from inside the mounted image — where an update could not
  # replace it even with a Developer ID.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Where a running app looks for something newer, and where CI pushes it.
# The repository is public, so the updater needs no token and no auth.
publish:
  provider: github
  owner: yunidbauza
  repo: the-hive
  # **The workflow owns publication, not electron-builder.**
  #
  # `draft` here does not mean "ship drafts". `.github/workflows/release.yml`
  # creates the draft before the build, electron-builder uploads into it, and a
  # later step flips it to published — but only after checking that
  # `latest-mac.yml` actually made it. Publication becomes one decision, taken
  # in one place, once there is something worth publishing.
  #
  # This replaced `releaseType: release`, which was itself a fix for the draft
  # default and made things worse in a new way. electron-builder runs two
  # publishers concurrently and each does a check-then-create on the release;
  # under `release` the loser's POST comes back
  # `422 already_exists` and **throws**, aborting the publish after the dmg and
  # zip have uploaded but before `latest-mac.yml` does. The v0.1.4 run did
  # exactly that, and the resulting assetless-but-`latest` release 404'd the
  # update check of every installed copy until it was deleted by hand.
  #
  # With the draft pre-created by the workflow there is nothing left to race
  # over, and a build that fails leaves behind a draft — invisible to the
  # updater and to `releases/latest`, and swept up by the tidy step.
  releaseType: draft
