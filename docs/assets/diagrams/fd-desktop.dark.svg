<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635.95 412" width="635.95" height="412" style="--bg:#10152a;--fg:#e9effc;--line:#6b779f;--accent:#8fa7f2;--muted:#98a3cc;--surface:#141a33;--border:#273159;background:var(--bg)">
<style>

  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.4, 0 4.8" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.4, 0 4.8" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<rect x="184.95" y="238" width="244.59999999999997" height="124" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
<rect x="184.95" y="238" width="175.5" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="190.95" y="247" dy="0.35em" font-size="11" font-weight="600" fill="var(--_text-sec)">alt [over 512 KB unacked]</text>
<line x1="184.95" y1="314" x2="429.54999999999995" y2="314" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<text x="192.95" y="328" font-size="11" font-weight="400" fill="var(--_text-muted)">[under 128 KB]</text>
<line x1="92.475" y1="70" x2="92.475" y2="382" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="239.54999999999998" y1="70" x2="239.54999999999998" y2="382" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="379.54999999999995" y1="70" x2="379.54999999999995" y2="382" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="532.75" y1="70" x2="532.75" y2="382" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="92.475" y1="90" x2="239.54999999999998" y2="90" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="166.0125" y="84" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">many small writes</text>
<line x1="239.54999999999998" y1="130" x2="379.54999999999995" y2="130" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="309.54999999999995" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">output</text>
<line x1="379.54999999999995" y1="170" x2="532.75" y2="170" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="456.15" y="164" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">pty:data batch (8 ms, 64 KB)</text>
<line x1="532.75" y1="210" x2="379.54999999999995" y2="210" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="456.15" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">ack after xterm parses</text>
<line x1="379.54999999999995" y1="278" x2="239.54999999999998" y2="278" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="309.54999999999995" y="272" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">pause reading</text>
<line x1="379.54999999999995" y1="342" x2="239.54999999999998" y2="342" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="309.54999999999995" y="336" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">resume</text>
<rect x="29.999999999999993" y="30" width="124.95" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="92.475" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">claude in pty</text>
<rect x="194.95" y="30" width="89.2" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="239.54999999999998" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">PTY host</text>
<rect x="339.54999999999995" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="379.54999999999995" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Main</text>
<rect x="459.55" y="30" width="146.4" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="532.75" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Renderer (xterm)</text>
</svg>