<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568.175 320" width="568.175" height="320" style="--bg:#fdfdfb;--fg:#2c2f34;--line:#8e949c;--accent:#334fa9;--muted:#73767c;--surface:#ffffff;--border:#d4dee3;background:var(--bg)">
<style>

  text { font-family: 'system-ui', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.4, 0 4.8" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.4, 0 4.8" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line x1="78.17500000000001" y1="70" x2="78.17500000000001" y2="290" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="218.175" y1="70" x2="218.175" y2="290" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="358.175" y1="70" x2="358.175" y2="290" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="498.175" y1="70" x2="498.175" y2="290" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="78.17500000000001" y1="90" x2="218.175" y2="90" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="148.175" y="84" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">ask a12 to the overmind</text>
<line x1="218.175" y1="130" x2="358.175" y2="130" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="288.175" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">card</text>
<line x1="498.175" y1="170" x2="358.175" y2="170" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="428.175" y="164" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Approve</text>
<line x1="358.175" y1="210" x2="218.175" y2="210" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="288.175" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">answer a12</text>
<line x1="218.175" y1="250" x2="78.17500000000001" y2="250" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="148.175" y="244" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">wake with the answer</text>
<rect x="30.000000000000007" y="30" width="96.35000000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="78.17500000000001" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Agent run</text>
<rect x="178.175" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="218.175" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Ledger</text>
<rect x="318.175" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="358.175" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Inbox</text>
<rect x="458.175" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="498.175" y="50" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">You</text>
</svg>