# Cut a release.
#
#     pnpm version minor        # bumps package.json and tags v0.2.0
#     git push --follow-tags
#
# The tag is the trigger and `package.json`'s version is the source of truth —
# electron-builder reads it, and the two cannot disagree because `pnpm version`
# writes both. See `docs/packaging-and-updates.md`.

name: Release

on:
  push:
    tags:
      - 'v*'
  # The escape hatch: rebuild a release whose assets went wrong without moving
  # a tag. Moving a published tag is the one thing that genuinely breaks the
  # updater, because `latest-mac.yml` pins a SHA-512 of each asset and a client
  # mid-download would fail the checksum.
  workflow_dispatch:

# Least privilege, and `contents: write` is the whole of what is needed —
# electron-builder creates the release and uploads to it with `GH_TOKEN`.
permissions:
  contents: write

jobs:
  macos:
    name: macOS (arm64)
    # An Apple Silicon runner, deliberately, not `macos-latest`-whatever-that-is.
    # The build must produce an arm64 bundle, and `node-pty`'s prebuild is
    # selected by the *host* architecture during install — cross-building it
    # from an Intel runner is the slow way to discover that at first launch.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # Matches `engines.node` in package.json. `cache: pnpm` needs
          # pnpm/action-setup to have run first, which is why it is above.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        # `postinstall` runs `check-native-abi.mjs --fix`, which chmods
        # `node-pty`'s spawn-helper. That has to happen *before* packaging: the
        # bit is copied into the bundle as found, and a 0644 helper is an app
        # whose terminals all fail at spawn.
        run: pnpm install --frozen-lockfile

      - name: Verify
        # The same gates AGENTS.md requires of any change. A release is the last
        # place to find out that type-check was red.
        run: |
          pnpm run lint
          pnpm run type-check
          pnpm run test

      - name: Create the draft release, so nothing has to race to create it
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # electron-builder runs **two** publishers concurrently, and each does a
        # check-then-create on the release. Both see "doesn't exist", both POST,
        # and one of them loses. Straight from the v0.1.4 log:
        #
        #   • publishing  publisher=Github …            (twice, 8ms apart)
        #   • creating GitHub release  reason=release doesn't exist  tag=v0.1.4
        #   • creating GitHub release  reason=release doesn't exist  tag=v0.1.4
        #   HttpError: 422 … {"code":"already_exists","field":"tag_name"}
        #
        # The loser throws, which aborts the publish **after** the dmg and zip
        # have uploaded but **before** `latest-mac.yml` does. That leaves a
        # release the updater cannot read sitting at the top of the list as
        # `latest`, so every installed copy's update check 404s. Measured: it
        # did exactly that, until the release was deleted by hand.
        #
        # Creating it here first means `reason=release doesn't exist` is never
        # true and there is nothing to race over.
        #
        # **A draft**, deliberately. A draft is invisible to the updater and to
        # `releases/latest`, so the several minutes between "release exists" and
        # "release has its assets" cannot break a running app — which is the
        # very failure this step is here to prevent, and it would be absurd to
        # reintroduce it in a smaller window. It is published at the end, once
        # there is something worth publishing.
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists — reusing it."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --notes "Download the \`.dmg\` below. Once installed, The Hive checks for new versions itself and tells you in the Inbox."

      - name: Build and publish
        env:
          # electron-builder uploads the dmg, the zip and latest-mac.yml to the
          # draft created above. It no longer creates anything: `releaseType:
          # draft` in electron-builder.yml means it also never flips the draft,
          # so publication is one decision made in one place — the step below,
          # and only when the build actually succeeded.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no Developer ID. Told explicitly rather than left to be
          # inferred, so a runner that happens to have a keychain entry cannot
          # change what gets built.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run desktop:publish

      - name: Publish the release
        # Only on success, and only once `latest-mac.yml` is actually there. A
        # release without it is not a release — the updater reads that file and
        # nothing else to decide a new version exists.
        if: success() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]')
          echo "assets: $assets"
          echo "$assets" | jq -e 'index("latest-mac.yml")' >/dev/null \
            || { echo "ABORT: latest-mac.yml is missing — refusing to publish a release no app can use."; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published $GITHUB_REF_NAME."

      - name: Tidy the releases for this tag
        # `always()`, because the case that hurt was a **failed** run leaving an
        # unusable release behind. Runs after both outcomes.
        if: always() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One rule, which covers every way this can go wrong: **keep exactly the
        # release that carries `latest-mac.yml`, delete every other release for
        # this tag.**
        #
        # A release without that file cannot serve an update, so it is never
        # worth keeping — whether it is a duplicate the publisher raced into
        # existence, or the half-finished remains of a build that failed. And a
        # good release from an earlier run is never at risk, because it has the
        # file.
        run: |
          set -euo pipefail
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\")]")
          keep=$(echo "$releases" | jq -r \
            'map(select([.assets[].name] | index("latest-mac.yml"))) | .[0].id // empty')
          echo "$releases" | jq -r --arg keep "${keep:-0}" \
            '.[] | select(.id != ($keep | tonumber)) | .id' \
          | while read -r stray; do
              echo "Deleting unusable release $stray for ${GITHUB_REF_NAME}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$stray"
            done
          if [ -z "$keep" ]; then
            echo "Nothing for ${GITHUB_REF_NAME} carries latest-mac.yml — kept nothing."
          else
            echo "Kept release $keep."
          fi

      - name: Record what shipped
        # The signature state of the shipped bundle, in the build log, on every
        # release. The whole update design turns on whether this says `adhoc`,
        # and reading it out of a log beats re-deriving it from a local build
        # that may not match.
        if: always()
        run: |
          echo "--- dist ---"
          ls -la dist || true
          echo "--- codesign ---"
          codesign --display --verbose=2 "dist/mac-arm64/The Hive.app" 2>&1 || true
